[project]
name = "agendapro"
version = "0.1.0"
description = "AgendaPro - Sistema de agendamento para professores"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.12.0",
    "python-dotenv>=1.2.2",
    "stripe>=14.4.1",
    "supabase>=2.28.0",
    "uvicorn[standard]>=0.41.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/infrastructure/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
